<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROTA // FSPH — Squad 19 · Pitch Final Takeoff</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #091217;
      --bg-card: #0F1E26;
      --border-card: #1D3542;
      --amber: #F59E0B;
      --emerald: #10B981;
      --crimson: #F43F5E;
      --cyan: #38BDF8;
      --paper: #F4EFE6;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: #F8FAFC;
      overflow: hidden;
      user-select: none;
    }
    .font-serif-display {
      font-family: 'Instrument Serif', Georgia, serif;
    }
    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }
    .font-hand {
      font-family: 'Caveat', cursive;
    }
    .bg-dot-grid {
      background-color: #091217;
      background-image: radial-gradient(#1D3542 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .bg-lined-paper {
      background-color: #F3EFE6;
      background-image: repeating-linear-gradient(
        transparent,
        transparent 31px,
        #E0D9CC 31px,
        #E0D9CC 32px
      );
    }
    .bento-card {
      background: linear-gradient(180deg, rgba(18, 35, 44, 0.92) 0%, rgba(11, 22, 28, 0.96) 100%);
      border: 1px solid rgba(36, 65, 82, 0.85);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bento-card:hover {
      border-color: rgba(245, 158, 11, 0.45);
      transform: translateY(-2px);
    }
    .slide-enter {
      animation: slideFadeIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.992); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    input[type=range] {
      accent-color: #F59E0B;
    }
  </style>
</head>
<body class="bg-dot-grid h-screen w-screen flex flex-col justify-between">

  <!-- TOP EDITORIAL BAR -->
  <header class="h-14 px-8 border-b border-[#192D38] bg-[#091217]/90 backdrop-blur-md flex items-center justify-between z-30">
    <div class="flex items-center gap-3">
      <span class="h-2.5 w-2.5 rounded-full bg-amber-400 animate-pulse"></span>
      <span class="font-mono-tech text-xs tracking-widest uppercase text-slate-300">SQUAD 19 // FSPH · PROJETO ROTA</span>
    </div>
    <div id="rubric-badge" class="font-mono-tech text-xs px-3.5 py-1 rounded-full bg-[#12242E] border border-amber-500/40 text-amber-300 tracking-wide">
      ITEM 2.1.A · PROBLEMÁTICA & OPORTUNIDADE DE IA
    </div>
    <div class="flex items-center gap-4">
      <span id="timer-badge" class="font-mono-tech text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-500/30 px-3 py-1 rounded-md">
        ⏱ 00:00 – 00:55
      </span>
      <button onclick="toggleNotes()" class="font-mono-tech text-xs px-3 py-1.5 rounded-md bg-amber-500/15 hover:bg-amber-500/25 border border-amber-500/40 text-amber-300 transition cursor-pointer">
        🎙️ Ver Fala (Roteiro)
      </button>
    </div>

  <!-- MAIN SLIDE VIEWPORT -->
  <main id="slide-container" class="flex-1 relative overflow-hidden flex items-center justify-center px-10 py-6">

  </main>

  <!-- SPEAKER NOTES DRAWER -->
  <div id="notes-drawer" class="hidden fixed bottom-16 left-1/2 -translate-x-1/2 w-[88%] max-w-5xl bg-[#0D1A22]/98 border border-amber-500/50 rounded-2xl p-6 shadow-2xl z-40 backdrop-blur-xl">
    <div class="flex items-center justify-between mb-2">
      <span class="font-mono-tech text-xs uppercase tracking-wider text-amber-400">🎙️ Fala Cronometrada deste Slide</span>
      <button onclick="toggleNotes()" class="text-slate-400 hover:text-white font-mono-tech text-xs">✕ Fechar [N]</button>
    </div>
    <p id="notes-content" class="text-slate-100 text-base leading-relaxed font-normal"></p>
  </div>

  <!-- BOTTOM NAVIGATION BAR -->
  <footer class="h-14 px-8 border-t border-[#192D38] bg-[#091217]/90 backdrop-blur-md flex items-center justify-between z-30">

    <div class="flex items-center gap-3">
      <button onclick="prevSlide()" class="px-3.5 py-1.5 rounded-lg bg-[#12232C] hover:bg-[#1B3340] border border-[#234050] text-slate-200 font-mono-tech text-xs transition cursor-pointer">
        ← Anterior
      </button>
      <span id="slide-counter" class="font-mono-tech text-xs text-slate-400 w-16 text-center">01 / 09</span>
      <button onclick="nextSlide()" class="px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-mono-tech font-semibold text-xs transition cursor-pointer">
        Próximo →
      </button>
    </div>
  </footer>

  <script>
    let currentSlide = 0;
    let notebookClosed = false;
    let demoStep = 0;
    let liveIframeMode = false;
    let scaleCalls = 3000;
    let blackoutSim = false;
    let selectedPromptFail = 0;

    const slides = [
      // SLIDE 01 — COLD OPEN: 10:00 / 14:00 / 03:15 & O CADERNO FECHADO
      {

        time: "⏱ 00:00 – 00:55",
        notes: `“Às 10h da manhã, uma caixa térmica com bolsas de sangue precisa sair do HEMOSE. Às 14h, amostras epidemiológicas precisam chegar ao LACEN. E às 3h15 da madrugada, uma família perde um ente querido em casa e aciona o SVO. Na primeira apresentação, nós mostramos a vocês que toda essa operação crítica do Estado de Sergipe dependia da memória do Vitor, de 4 canais de WhatsApp e de um caderno de papel. E nós fizemos uma promessa: na próxima solicitação, o caderno estaria fechado. Hoje nós não viemos mostrar um protótipo no Figma. Nós viemos mostrar o ROTA vivo, blindado por mais de 1.110 testes automatizados e operando no computador do gestor e no celular do motorista — mesmo sem internet no meio da estrada.”`,
        render: () => `

                <div class="text-sm font-semibold text-white">LACEN · Transporte Biológico</div>

            <!-- Interactive Notebook -> ROTA Transformation -->

                <div class="absolute left-7 top-0 bottom-0 w-0.5 bg-red-400/70"></div>
                <div class="pl-5">
                  <span class="font-mono-tech text-[11px] uppercase px-2 py-0.5 rounded bg-red-600 text-white">1ª Apresentação · O Caos de Vitor</span>

                  <div class="mt-4 space-y-2 text-xs font-medium ${notebookClosed ? 'text-slate-400' : 'text-slate-700'}">

                  </div>

                </div>
              </div>

                <div>
                  <div class="flex items-center justify-between">
                    <span class="font-mono-tech text-xs uppercase tracking-widest text-emerald-400 bg-emerald-950/60 border border-emerald-500/40 px-3 py-1 rounded-full">

                  </div>
                  <h1 class="font-serif-display text-5xl leading-tight mt-4 text-white">
                    Não trouxemos um Figma.<br/>
                    Trouxemos o <span class="italic text-amber-400">ROTA vivo</span>.
                  </h1>
                  <p class="text-slate-300 text-sm mt-3 max-w-xl">

                  </p>
                </div>

                <div class="grid grid-cols-3 gap-4 mt-6 pt-5 border-t border-[#1E3644]">
                  <div>
                    <div class="font-mono-tech text-2xl font-bold text-emerald-400">1.110+</div>
                    <div class="text-xs text-slate-400">Testes Automatizados</div>
                  </div>
                  <div>
                    <div class="font-mono-tech text-2xl font-bold text-amber-400">Zero</div>

                  <div>

                    <div class="text-xs text-slate-400">PWA Motorista + OSRM</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `
      },

      // SLIDE 02 — FERRAMENTAS & SERVIÇOS DE IA NA ENGENHARIA (2.1.B & 2.1.C)
      {
        rubric: "ITENS 2.1.B & 2.1.C · FERRAMENTAS UTILIZADAS + SERVIÇOS DE IA E IMPACTO",
        time: "⏱ 00:55 – 01:45",
        notes: `“Para tirar o ROTA do papel com qualidade industrial, construímos uma arquitetura moderna: React 19, TypeScript, Tailwind 4 e PWA com IndexedDB na ponta do Vitor e do motorista; Node.js, Express 5, Prisma 6 e Zod no Back-End; e Neon PostgreSQL com extensão espacial PostGIS e um servidor próprio de rotas OSRM em Docker. Durante o desenvolvimento, orquestramos quatro serviços de IA rastreados na pasta /prompts do nosso GitHub: Google Gemini e Antigravity na arquitetura, modelagem e auditoria LGPD; Claude Sonnet em locks transacionais e massa sintética; OpenAI GPT/Codex no PWA offline; e GitHub Copilot na padronização entre os 10 membros.”`,
        render: () => `
          <div class="w-full max-w-6xl mx-auto slide-enter">
            <div class="text-center mb-8">
              <h2 class="font-serif-display text-5xl text-white">
                Forjado com <span class="italic text-amber-400">4 motores de IA</span>. Blindado por código determinístico.
              </h2>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-6">
              <!-- 2.1.b Stack -->
              <div class="bento-card rounded-2xl p-6">

                    <div class="text-xs text-slate-400 mt-1">Tailwind 4 + IndexedDB Offline</div>
                  </div>
                  <div class="p-3.5 rounded-xl bg-[#0B161C] border border-[#1B313E]">
                    <div class="font-mono-tech text-xs text-emerald-400 font-semibold">BACK-END & SEGURANÇA</div>
                    <div class="text-sm text-white font-semibold mt-1">Node.js · Express 5 · Prisma 6</div>
                    <div class="text-xs text-slate-400 mt-1">Zod + Cookies HttpOnly + CSRF</div>
                  </div>
                  <div class="p-3.5 rounded-xl bg-[#0B161C] border border-[#1B313E]">
                    <div class="font-mono-tech text-xs text-cyan-400 font-semibold">GEOESPACIAL & ROTAS</div>
                    <div class="text-sm text-white font-semibold mt-1">PostgreSQL + PostGIS</div>
                    <div class="text-xs text-slate-400 mt-1">Motor de Rotas OSRM em Docker</div>
                  </div>
                  <div class="p-3.5 rounded-xl bg-[#0B161C] border border-[#1B313E]">
                    <div class="font-mono-tech text-xs text-rose-400 font-semibold">QUALIDADE & CI/CD</div>

                  </div>
                </div>
              </div>

              <!-- 2.1.c Serviços de IA -->
              <div class="bento-card rounded-2xl p-6">
                <div class="font-mono-tech text-xs text-amber-400 uppercase tracking-wider mb-4">[2.1.C] Serviços de IA na Engenharia (Acervo /prompts)</div>
                <div class="space-y-2.5">
                  <div class="p-3 rounded-xl bg-[#0B161C] border border-[#1B313E] flex items-center justify-between">
                    <div>
                      <span class="text-sm font-bold text-white">Google Gemini 2.5 Pro & Antigravity</span>
                      <p class="text-xs text-slate-400">Schema Prisma/PostGIS (PRM-01), Máquina de Estados (PRM-02) e Auditoria LGPD (PRM-04)</p>
                    </div>
                    <span class="font-mono-tech text-[11px] px-2.5 py-1 rounded bg-amber-500/15 text-amber-300">Arquitetura</span>
                  </div>
                  <div class="p-3 rounded-xl bg-[#0B161C] border border-[#1B313E] flex items-center justify-between">
                    <div>
                      <span class="text-sm font-bold text-white">Anthropic Claude Sonnet</span>
                      <p class="text-xs text-slate-400">Locks transacionais (SELECT FOR UPDATE) e Seed Sintético Determinístico (PRM-03)</p>
                    </div>
                    <span class="font-mono-tech text-[11px] px-2.5 py-1 rounded bg-emerald-500/15 text-emerald-300">Concorrência</span>
                  </div>
                  <div class="p-3 rounded-xl bg-[#0B161C] border border-[#1B313E] flex items-center justify-between">
                    <div>
                      <span class="text-sm font-bold text-white">OpenAI GPT-4o / Codex + GitHub Copilot</span>
                      <p class="text-xs text-slate-400">Fila Offline IndexedDB + OSRM no PWA (PRM-05) e padronização entre 10 devs</p>
                    </div>
                    <span class="font-mono-tech text-[11px] px-2.5 py-1 rounded bg-cyan-500/15 text-cyan-300">PWA & Velocidade</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Impact Strip -->
            <div class="grid grid-cols-4 gap-4">
              <div class="bento-card rounded-xl p-4 text-center">
                <div class="font-mono-tech text-3xl font-bold text-amber-400">20+</div>
                <div class="text-xs text-slate-400 mt-1">Migrations PostgreSQL/PostGIS</div>
              </div>
              <div class="bento-card rounded-xl p-4 text-center">
                <div class="font-mono-tech text-3xl font-bold text-emerald-400">915 + 235</div>
                <div class="text-xs text-slate-400 mt-1">Testes Back-End + Front-End + E2E</div>
              </div>
              <div class="bento-card rounded-xl p-4 text-center">
                <div class="font-mono-tech text-3xl font-bold text-cyan-400">PRM-01..05</div>
                <div class="text-xs text-slate-400 mt-1">Prompts Versionados no GitHub</div>

              <div class="bento-card rounded-xl p-4 text-center">
                <div class="font-mono-tech text-3xl font-bold text-white">0 Warnings</div>
                <div class="text-xs text-slate-400 mt-1">280+ arquivos validados no Oxlint</div>
              </div>

      // SLIDE 03 — OS 5 DIFERENCIAIS DA SOLUÇÃO (2.1.D)
      {
        rubric: "ITEM 2.1.D · DIFERENCIAIS TÉCNICOS E OPERACIONAIS DA SOLUÇÃO",
        time: "⏱ 01:45 – 02:25",
        notes: `“E por que o ROTA é diferente de qualquer planilha ou sistema genérico? Por 5 diferenciais feitos sob medida para a FSPH: 1) Viagens Institucionais sem conflito para o Vitor aprovar demandas do HEMOSE e LACEN com cancelamento formal auditado; 2) Conservação em ciclo fechado, onde o checklist do motorista abre avaria automática e agenda manutenção com reserva de horário; 3) Segregação e Biossegurança estrita no SVO com limite de 4 urnas e status automático de DESINFECCAO; 4) PWA Mobile Offline-First no celular do Fábio; e 5) Trilha de Auditoria LGPD com relatórios CSV e PDF.”`,
        render: () => `

                <div class="flex items-center justify-between mb-3">
                  <span class="font-mono-tech text-xs px-2.5 py-1 rounded bg-cyan-500/20 text-cyan-300">02 · CONSERVAÇÃO ATIVA</span>

              <div class="col-span-2 bento-card rounded-2xl p-5 border-t-2 border-t-emerald-400">
                <span class="font-mono-tech text-xs px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">04 · CAMPO & ESTRADA</span>

    function renderCurrentSlide() {
      const s = slides[currentSlide];

      document.getElementById('notes-content').textContent = s.notes;
      document.getElementById('slide-container').innerHTML = s.render();

      const dotsHtml = slides.map((_, idx) => `
        <button onclick="goToSlide(${idx})" class="h-2 rounded-full transition-all cursor-pointer ${idx === currentSlide ? 'w-8 bg-amber-400' : 'w-2 bg-slate-700 hover:bg-slate-500'}"></button>
      `).join('');
      document.getElementById('slide-dots').innerHTML = dotsHtml;
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderCurrentSlide();
      }
    }

    function goToSlide(idx) {
      currentSlide = idx;
      renderCurrentSlide();
    }

    function toggleNotes() {
      const el = document.getElementById('notes-drawer');
      el.classList.toggle('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'n') {
        toggleNotes();
      }
    });

    renderCurrentSlide();
