name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias dos workspaces
        run: npm ci

      - name: Verificar lint
        run: npm run lint

      - name: Verificar tipos e executar testes unitarios
        run: npm test

      - name: Compilar back-end e front-end
        run: npm run build
