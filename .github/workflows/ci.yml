name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dependencies: ${{ steps.dependencies.outcome }}
      lint: ${{ steps.lint.outcome }}
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}

    steps:
      - name: Obter codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias dos workspaces
        id: dependencies
        run: npm ci

      - name: Verificar lint
        id: lint
        run: npm run lint

      - name: Verificar tipos e executar testes unitarios
        id: tests
        run: npm test

      - name: Compilar back-end e front-end
        id: build
        run: npm run build

  comment:
    name: Comentar resultado no PR
    needs: quality
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Publicar ou atualizar resumo
        uses: actions/github-script@v9
        env:
          STEP_RESULTS: ${{ toJSON(needs.quality.outputs) }}
          CI_RESULT: ${{ needs.quality.result }}
        with:
          script: |
            const marker = '<!-- gestao-frota-ci -->';
            const results = JSON.parse(process.env.STEP_RESULTS);
            const statuses = {
              success: '✅',
              failure: '❌',
              cancelled: '🚫 cancelado',
              skipped: '⏭️ não executado',
            };
            const status = (outcome) => statuses[outcome] ?? statuses.skipped;
            const conclusions = {
              success: '✅ CI aprovada',
              failure: '❌ CI com falha',
              cancelled: '🚫 CI cancelada',
              skipped: '⏭️ CI não executada',
            };
            const sha = context.payload.pull_request.head.sha;
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const body = [
              marker,
              '## 👁️ O olho que tudo vê',
              '',
              `**${conclusions[process.env.CI_RESULT] ?? '⚠️ CI sem resultado'}**`,
              '',
              `📦 Dependências · ${status(results.dependencies)}  `,
              `🔎 Lint · ${status(results.lint)}  `,
              `🧪 Testes e tipos · ${status(results.tests)}  `,
              `🏗️ Build · ${status(results.build)}`,
              '',
              `Commit: [${sha.slice(0, 7)}](${repoUrl}/commit/${sha}) · [Ver execução completa](${runUrl})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
