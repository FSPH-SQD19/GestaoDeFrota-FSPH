name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Corrigir formatação
    if: >-
      ${{ github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Obter branch do PR
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Aplicar formatação
        run: npm exec --yes --package=prettier@3.9.10 -- prettier --write .

      - name: Enviar correção ao PR
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format code with Prettier"

          encoded_token="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded_token}" \
            push origin "HEAD:refs/heads/${PR_BRANCH}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Lint, testes e build
    needs: format
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dependencies: ${{ steps.dependencies.outcome }}
      format: ${{ steps.format.outcome }}
      autofix: ${{ needs.format.result }}
      format_changed: ${{ needs.format.outputs.changed }}
      format_sha: ${{ needs.format.outputs.sha }}
      lint: ${{ steps.lint.outcome }}
      tests: ${{ steps.tests.outcome }}
      build: ${{ steps.build.outcome }}
      browsers: ${{ steps.browsers.outcome }}
      e2e: ${{ steps.e2e.outcome }}

    steps:
      - name: Obter branch atualizada do PR
        if: >-
          ${{ github.event_name == 'pull_request'
              && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Obter código
        if: >-
          ${{ github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias dos workspaces
        id: dependencies
        run: npm ci

      - name: Verificar formatação
        id: format
        run: npm exec --yes --package=prettier@3.9.10 -- prettier --check .

      - name: Verificar lint
        id: lint
        run: npm run lint

      - name: Verificar tipos e executar testes unitarios
        id: tests
        run: npm test

      - name: Compilar back-end e front-end
        id: build
        run: npm run build

      - name: Instalar Chromium e dependências do sistema
        id: browsers
        run: npx playwright install --with-deps chromium

      - name: Executar testes de interface com Playwright
        id: e2e
        run: npm run test:e2e

      - name: Publicar relatório e evidências do Playwright
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: |
            FrontEnd/playwright-report/
            FrontEnd/test-results/
          retention-days: 14
          if-no-files-found: warn

  rerun:
    name: Revalidar commit formatado
    needs: [format, quality]
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request'
          && needs.format.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write

    steps:
      - name: Iniciar CI no commit atualizado
        uses: actions/github-script@v9
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              ref: process.env.PR_BRANCH,
            });

  comment:
    name: Comentar resultado no PR
    needs: [format, quality, rerun]
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Publicar ou atualizar resumo
        uses: actions/github-script@v9
        env:
          STEP_RESULTS: ${{ toJSON(needs.quality.outputs) }}
          CI_RESULT: ${{ (needs.quality.result == 'failure' || needs.format.result == 'failure' || needs.rerun.result == 'failure') && 'failure' || (needs.quality.result == 'cancelled' || needs.format.result == 'cancelled' || needs.rerun.result == 'cancelled') && 'cancelled' || 'success' }}
          FORMAT_CHANGED: ${{ needs.format.outputs.changed }}
          RERUN_RESULT: ${{ needs.rerun.result }}
        with:
          script: |
            const marker = '<!-- gestao-frota-ci -->';
            const results = JSON.parse(process.env.STEP_RESULTS);
            const statuses = {
              success: '✅ concluído',
              failure: '❌ falhou',
              cancelled: '🚫 cancelado',
              skipped: '⏭️ não executado',
            };
            const status = (outcome, successMessage = 'concluído') =>
              outcome === 'success' ? `✅ ${successMessage}` : statuses[outcome] ?? statuses.skipped;
            const formatChanged = process.env.FORMAT_CHANGED === 'true';
            const conclusions = {
              success: '✅ CI aprovada',
              failure: '❌ CI com falha',
              cancelled: '🚫 CI cancelada',
              skipped: '⏭️ CI não executada',
            };
            const gifs = {
              approved: {
                alt: 'Gato comemorando a aprovação da CI',
                width: 200,
                height: 200,
                url: 'https://github.com/user-attachments/assets/8ab88a93-7ca3-4a94-a586-5e1c1ce37731',
              },
              failed: {
                alt: 'Gato reagindo à reprovação da CI',
                width: 200,
                height: 198,
                url: 'https://github.com/user-attachments/assets/0f7fe24e-468d-4668-afe5-5c436bf4f276',
              },
              formatting: {
                alt: 'Gato corrigindo a formatação',
                width: 200,
                height: 200,
                url: 'https://github.com/user-attachments/assets/fdd33a1a-7f26-4c8b-8897-b1ba4e3edb59',
              },
            };
            const gif = formatChanged
              ? gifs.formatting
              : process.env.CI_RESULT === 'success'
                ? gifs.approved
                : process.env.CI_RESULT === 'failure'
                  ? gifs.failed
                  : null;
            const sha = results.format_sha || context.payload.pull_request.head.sha;
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}/attempts/${process.env.GITHUB_RUN_ATTEMPT}`;
            const resultLines = [
              `<h3>${conclusions[process.env.CI_RESULT] ?? '⚠️ CI sem resultado'}</h3>`,
              `💅 Formatação · ${status(results.format, 'aprovada')}`,
              `🔎 Lint · ${status(results.lint, 'aprovado')}`,
              `🧪 Testes unitários · ${status(results.tests, 'aprovados')}`,
              `🎭 Testes de interface · ${status(results.e2e, 'aprovados')}`,
              `🏗️ Build · ${status(results.build)}`,
              ...(formatChanged ? ['🧹 Formatação corrigida automaticamente'] : []),
              ...(results.autofix === 'failure' ? ['❌ Falha na correção automática'] : []),
              ...(results.dependencies === 'failure' ? ['❌ Falha ao instalar dependências'] : []),
              ...(results.browsers === 'failure' ? ['❌ Falha na preparação dos testes de interface'] : []),
              ...(process.env.RERUN_RESULT === 'failure' ? ['❌ Falha ao solicitar nova execução da CI'] : []),
            ].join('<br>');
            const body = [
              marker,
              '## 👁️ O olho que tudo vê',
              '',
              '<table width="100%" style="table-layout:fixed;">',
              '  <colgroup>',
              '    <col width="480">',
              '    <col width="480">',
              '  </colgroup>',
              '  <tbody>',
              '    <tr>',
              '      <td width="480" valign="top">',
              `        ${resultLines}`,
              '      </td>',
              '      <td width="480" align="center" valign="middle">',
              ...(gif
                ? [`        <img width="${gif.width}" height="${gif.height}" alt="${gif.alt}" src="${gif.url}" />`]
                : ['        <em>Sem GIF para este estado</em>']),
              '      </td>',
              '    </tr>',
              '  </tbody>',
              '</table>',
              '',
              `Commit: [${sha.slice(0, 7)}](${repoUrl}/commit/${sha}) · [Ver execução completa](${runUrl})`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body,
              });
            }
