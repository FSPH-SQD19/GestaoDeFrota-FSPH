name: CD HML

on:
  push:
    branches: [hml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hml
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/hml'
    name: Publicar front e back na Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hml

    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Validar testes e compilar front e back
        env:
          VITE_API_URL: /
        run: npm run check && npm run cloudflare:check

      - name: Conferir banco de HML e desativar cache de consultas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: node scripts/check-hml-database.mjs

      - name: Aplicar migrações pendentes no Neon
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: |
          if [ -z "$DATABASE_URL_MIGRATIONS" ]; then
            echo "::error::Configure DATABASE_URL_MIGRATIONS no ambiente hml do GitHub."
            exit 1
          fi
          npm exec --workspace=backend -- prisma migrate deploy

      - name: Publicar Worker de HML
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.156.0"
          environment: hml
          command: deploy --env hml
          secrets: |
            JWT_SECRET
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
