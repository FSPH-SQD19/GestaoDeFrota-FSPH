name: PWA PostGIS
on:
  pull_request:
    paths:
      - "BackEnd/**"
      - "scripts/test-driver-integration.mjs"
      - "package-lock.json"
      - ".github/workflows/pwa-postgis.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:integration:driver
