<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-c3">
  <title id="title-c3">Frota FSPH - Conceito 3 (Loop Infinito / Ciclo Operacional Contínuo)</title>
  <defs>
    <!-- Gradiente da Frota Administrativa (Azul Cobalto / Índigo) -->
    <linearGradient id="c3_blue" x1="60" y1="40" x2="220" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#38BDF8"/>
    </linearGradient>
    <!-- Gradiente da Frota SVO / Retorno (Azul Profundo / Carmim SVO) -->
    <linearGradient id="c3_dark" x1="200" y1="210" x2="40" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1E3A8A"/>
      <stop offset="100%" stopColor="#4F46E5"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Pista Superior: Despacho e Saída de Viaturas -->
    <path
      fill="url(#c3_blue)"
      d="M 64 128
         C 64 80 100 44 148 44
         C 180 44 206 62 216 88
         C 220 98 212 108 202 108
         C 193 108 186 102 181 94
         C 174 76 156 66 138 66
         C 104 66 86 92 86 128
         C 86 138 78 146 68 146
         C 58 146 64 138 64 128 Z"
    />
    
    <!-- Pista Inferior: Retorno, Triagem e Desinfecção Sanitária -->
    <path
      fill="url(#c3_dark)"
      d="M 192 128
         C 192 176 156 212 108 212
         C 76 212 50 194 40 168
         C 36 158 44 148 54 148
         C 63 148 70 154 75 162
         C 82 180 100 190 118 190
         C 152 190 170 164 170 128
         C 170 118 178 110 188 110
         C 198 110 192 118 192 128 Z"
    />
    
    <!-- Núcleo de Despacho em Tempo Real -->
    <circle cx="128" cy="128" r="14" fill="#3B82F6"/>
    <circle cx="128" cy="128" r="7" fill="#FFFFFF"/>
  </g>
</svg>
