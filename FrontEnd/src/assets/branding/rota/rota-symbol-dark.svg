<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="rota-symbol-dark-title">
  <title id="rota-symbol-dark-title">Símbolo Rota - Versão Luminosa para Superfícies Escuras</title>
  <defs>
    <!-- Gradiente Superior: Ciano Elétrico para Azul Royal Vibrante -->
    <linearGradient id="rota_dark_cyan" x1="40" y1="40" x2="220" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8"/>
      <stop offset="100%" stopColor="#60A5FA"/>
    </linearGradient>
    <!-- Gradiente Inferior: Índigo / Íris Luminoso para Ciano Claro -->
    <linearGradient id="rota_dark_iris" x1="220" y1="210" x2="40" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818CF8"/>
      <stop offset="50%" stopColor="#A5B4FC"/>
      <stop offset="100%" stopColor="#38BDF8"/>
    </linearGradient>
    <!-- Brilho Neon para Visibilidade em Fundo Preto/Dark -->
    <filter id="rota_neon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="symbol_dark">
    <!-- Pista de Saída / Despacho -->
    <path
      fill="url(#rota_dark_cyan)"
      d="M 64 128
         C 64 80 100 44 148 44
         C 180 44 206 62 216 88
         C 220 98 212 108 202 108
         C 193 108 186 102 181 94
         C 174 76 156 66 138 66
         C 104 66 86 92 86 128
         C 86 138 78 146 68 146
         C 58 146 64 138 64 128 Z"
    />
    
    <!-- Pista de Retorno / Desinfecção -->
    <path
      fill="url(#rota_dark_iris)"
      d="M 192 128
         C 192 176 156 212 108 212
         C 76 212 50 194 40 168
         C 36 158 44 148 54 148
         C 63 148 70 154 75 162
         C 82 180 100 190 118 190
         C 152 190 170 164 170 128
         C 170 118 178 110 188 110
         C 198 110 192 118 192 128 Z"
    />
    
    <!-- Ponto Central GPS Neon -->
    <circle cx="128" cy="128" r="14" fill="#38BDF8"/>
    <circle cx="128" cy="128" r="7" fill="#FFFFFF"/>
  </g>
</svg>
