<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="rota-symbol-title">
  <title id="rota-symbol-title">Símbolo Rota - Frota FSPH</title>
  <defs>
    <!-- Gradiente Primário: Pista Superior (Despacho / Agilidade) -->
    <linearGradient id="rota_grad_blue" x1="40" y1="40" x2="220" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2563EB"/>
      <stop offset="100%" stopColor="#38BDF8"/>
    </linearGradient>
    <!-- Gradiente Secundário: Pista Inferior (Retorno / Biossegurança SVO - Luminous Indigo & Azure) -->
    <linearGradient id="rota_grad_indigo" x1="220" y1="210" x2="40" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#4338CA"/>
      <stop offset="60%" stopColor="#6366F1"/>
      <stop offset="100%" stopColor="#0EA5E9"/>
    </linearGradient>
    <filter id="rota_glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g id="symbol" filter="url(#rota_glow)">
    <!-- Pista de Saída / Despacho -->
    <path
      fill="url(#rota_grad_blue)"
      d="M 64 128
         C 64 80 100 44 148 44
         C 180 44 206 62 216 88
         C 220 98 212 108 202 108
         C 193 108 186 102 181 94
         C 174 76 156 66 138 66
         C 104 66 86 92 86 128
         C 86 138 78 146 68 146
         C 58 146 64 138 64 128 Z"
    />
    
    <!-- Pista de Retorno / Desinfecção -->
    <path
      fill="url(#rota_grad_indigo)"
      d="M 192 128
         C 192 176 156 212 108 212
         C 76 212 50 194 40 168
         C 36 158 44 148 54 148
         C 63 148 70 154 75 162
         C 82 180 100 190 118 190
         C 152 190 170 164 170 128
         C 170 118 178 110 188 110
         C 198 110 192 118 192 128 Z"
    />
    
    <!-- Ponto de Rastreamento GPS e Sincronização em Tempo Real -->
    <circle cx="128" cy="128" r="14" fill="#0284C7"/>
    <circle cx="128" cy="128" r="7" fill="#FFFFFF"/>
  </g>
</svg>
