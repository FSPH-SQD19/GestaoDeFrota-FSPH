services:
  backend:
    build:
      context: .
      dockerfile: BackEnd/Dockerfile
    container_name: frota-svo-backend
    env_file:
      - BackEnd/.env
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - backend_auth:/app/BackEnd/.runtime
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    container_name: frota-svo-frontend
    build:
      context: .
      dockerfile: FrontEnd/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  backend_auth:
